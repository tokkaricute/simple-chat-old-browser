<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat for Old Browser</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar for Sessions -->
        <aside id="sidebar">
            <h2>Sessions</h2>
            <button id="new-session-btn">+ New Chat</button>
            <ul id="session-list"></ul>
        </aside>

        <!-- Main Content -->
        <main id="main-content">
            <header>
                <h1>Simple Chat for Old Browser</h1>
                <div id="connection-info">
                    Local: <span id="local-url"></span> &rarr; Target: <span id="target-url"></span>
                </div>
            </header>

            <!-- Configuration Section -->
            <section id="config-section">
                <div class="form-group">
                    <label for="model-select">モデル名</label>
                    <select id="model-select"></select>
                </div>

                <div class="form-group">
                    <label for="system-prompt-name">システムプロンプト名</label>
                    <input type="text" id="system-prompt-name">
                </div>

                <div class="form-group">
                    <label for="system-prompt-content">システムプロンプト</label>
                    <textarea id="system-prompt-content" rows="3"></textarea>
                </div>
            </section>

            <!-- Chat Display Area -->
            <section id="chat-container">
                <div id="chat-messages"></div>
            </section>

            <!-- Input Area -->
            <footer id="input-area">
                <div class="form-group">
                    <label for="user-prompt">ユーザプロンプト</label>
                    <textarea id="user-prompt" placeholder="メッセージを入力してください..." rows="3"></textarea>
                </div>
                <div class="controls">
                    <button id="send-btn" class="primary">送信</button>
                    <button id="clear-btn">消去 (現在のセッション)</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
